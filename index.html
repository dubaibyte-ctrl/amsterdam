/* Layout: one-hand phone app — header strip, 5 views behind a fixed bottom bar, bottom sheet for details */
:root{
  --bg:#eef2f3; --card:#ffffff; --fg:#13232a; --muted:#5a6b73; --line:#d6dfe2;
  --accent:#c8102e; --canal:#0f4c5c; --chip:#e3ecee; --water:#cfe1e6;
  --ok:#1f7a3f; --warn:#a86f00; --bad:#b3261e; --plan:#0f4c5c;
  --display:"Bricolage Grotesque",system-ui,-apple-system,sans-serif;
  --body:"Source Sans 3",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0c1518; --card:#142126; --fg:#e6eef0; --muted:#94a7ae; --line:#24363c;
  --accent:#ff5a6e; --canal:#6fc3d4; --chip:#1b2c32; --water:#16343d;
  --ok:#5fd18a; --warn:#f0c05a; --bad:#ff7b72; --plan:#6fc3d4; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c1518; --card:#142126; --fg:#e6eef0; --muted:#94a7ae; --line:#24363c;
  --accent:#ff5a6e; --canal:#6fc3d4; --chip:#1b2c32; --water:#16343d;
  --ok:#5fd18a; --warn:#f0c05a; --bad:#ff7b72; --plan:#6fc3d4; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:15.5px/1.42 var(--body);margin:0}
.wrap{max-width:640px;margin:0 auto;padding:0 16px calc(88px + env(safe-area-inset-bottom,0px))}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:var(--canal)}
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:15;background:var(--bg);padding-block:10px 8px;display:flex;justify-content:space-between;align-items:center;gap:8px;border-bottom:1px solid var(--line);margin:0 -16px;padding-inline:16px}
.brand{font:800 18px var(--display);letter-spacing:.02em}
.brand small{display:block;font:500 11.5px var(--mono);color:var(--muted);letter-spacing:.03em}
.hr{display:flex;align-items:center;gap:8px}
.clock{font:800 20px var(--display);font-variant-numeric:tabular-nums}
.net{font:500 11px var(--mono);border:1px solid var(--line);border-radius:999px;padding:3px 8px;white-space:nowrap;background:var(--card)}
.gear{border:1px solid var(--line);background:var(--card);border-radius:9px;width:34px;height:34px;padding:0}
h2{font:800 19px var(--display);margin:20px 0 8px;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;text-wrap:balance}
h2 small{font:500 11px var(--mono);color:var(--muted);letter-spacing:.04em}
h3{margin:0;font-size:16px}
.muted{color:var(--muted)} .sm{font-size:13.5px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;min-width:0}
.stack{display:grid;gap:8px}
.daylbl{font:500 12px var(--mono);color:var(--accent);letter-spacing:.06em;margin-top:12px}
.tiles{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:8px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:7px 6px;text-align:center;min-width:0}
.tile span{display:block;font:500 9.5px var(--mono);color:var(--muted);letter-spacing:.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile b{font:800 18px var(--display);font-variant-numeric:tabular-nums}
.bar{height:6px;border-radius:3px;background:var(--chip);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--canal);border-radius:3px;transition:width .3s}
.next{border:2px solid var(--accent);border-radius:14px;padding:12px 14px;background:var(--card);margin-top:10px}
.next .lbl{font:500 11px var(--mono);color:var(--accent);letter-spacing:.06em;display:flex;justify-content:space-between;gap:8px}
.next h3{font:800 22px/1.15 var(--display);margin:3px 0 4px;text-wrap:balance}
.cd{font:800 15px var(--display);color:var(--canal)}
.alerts{display:grid;gap:6px;margin-top:10px}
.alert{border-left:4px solid var(--accent);background:var(--card);border-radius:8px;padding:8px 12px;font-size:13.5px}
.alert.info{border-left-color:var(--canal)}
.big{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin-top:12px}
.big button{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 2px;font:700 10.5px var(--body);min-height:56px;line-height:1.1;display:grid;justify-items:center;align-content:center;gap:3px;text-align:center}
.big button span{font-size:18px}
.big button.on{border-color:var(--canal);box-shadow:inset 0 0 0 1px var(--canal)}
.big button.hot{background:var(--accent);border-color:var(--accent);color:var(--card)}
.chips{display:flex;gap:6px;overflow-x:auto;white-space:nowrap;scrollbar-width:none;padding-bottom:2px;margin:0 -16px;padding-inline:16px}
.chips::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-weight:600;font-size:13px;flex:none}
.chip[aria-pressed="true"]{background:var(--canal);border-color:var(--canal);color:var(--bg)}
.t{display:inline-block;font-size:11.5px;padding:2px 7px;border-radius:6px;background:var(--chip);white-space:nowrap}
.meta{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.pc{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-width:0}
.pc .main{display:block;width:100%;text-align:left;background:none;border:none;padding:0}
.pc .hd{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.pc .cu{font:500 11px var(--mono);color:var(--muted);white-space:nowrap}
.ord{margin-top:3px;font-size:14.5px}
.ord b{font:500 10.5px var(--mono);color:var(--accent);letter-spacing:.06em;margin-right:4px}
.sec{font-size:13px;color:var(--muted)}
.sec b{font:500 10px var(--mono);letter-spacing:.05em;margin-right:4px}
.note{font-size:12.5px;color:var(--warn);margin-top:3px}
.qa{display:flex;gap:6px;margin-top:8px}
.qa button,.qa a{flex:1;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:6px 0;font:700 12px var(--body);text-align:center;text-decoration:none;color:var(--fg)}
.qa .on{background:var(--ok);border-color:var(--ok);color:var(--card)}
.qa .sv{background:var(--card);border-color:var(--plan);color:var(--plan)}
.pc.done{opacity:.6}.pc.skip{opacity:.45}.pc.skip h3{text-decoration:line-through}
.lab{font:500 11px var(--mono);color:var(--muted);margin:10px 0 4px;letter-spacing:.05em}
.dayhd{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-top:12px}
.dayhd h3{font:800 22px var(--display)}
.daytag{font:500 11px var(--mono);color:var(--accent);letter-spacing:.06em}
.items{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:6px}
.it{display:grid;grid-template-columns:42px 30px 1fr 22px;gap:6px;align-items:start;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 8px}
.it time{font:500 12px var(--mono);color:var(--muted);padding-top:3px;font-variant-numeric:tabular-nums}
.ck{width:26px;height:26px;border-radius:7px;border:2px solid var(--line);background:var(--bg);display:grid;place-items:center;font-weight:800;color:var(--card);padding:0}
.it.done .ck{background:var(--ok);border-color:var(--ok)}
.it.done .txt{opacity:.6}.it.done .txt b{text-decoration:line-through}
.it.skip{opacity:.45}.it.skip .txt b{text-decoration:line-through}
.it.past:not(.done):not(.skip){border-style:dashed}
.it .slot{font:500 10.5px var(--mono);color:var(--canal);letter-spacing:.05em;display:block}
.it .txt{min-width:0}.it .txt b{font-weight:700}
.it .sub{font-size:13px;color:var(--muted)}
.it .more{border:none;background:none;font-size:18px;color:var(--muted);padding:0}
.it.nx{border-color:var(--accent);box-shadow:inset 3px 0 0 var(--accent)}
.it .open{border:none;background:none;padding:0;text-align:left;color:inherit;width:100%}

/* =========================================================
   TIME — phone clock, Amsterdam time zone
   ========================================================= */
function nowAms(){

  const o={};f.formatToParts(new Date()).forEach(x=>o[x.type]=x.value);
  const h=+o.hour%24,m=+o.minute;
  const dow=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"].indexOf(o.weekday);
  return {date:`${o.year}-${o.month}-${o.day}`,h,m,min:h*60+m,hm:`${String(h).padStart(2,"0")}:${o.minute}`,dow,wd:o.weekday,day:+o.day,mon:+o.month};
}
const MON=["","Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
function tripPhase(){const n=nowAms();if(n.date<DAYS[0].date)return "before";if(n.date>DAYS[DAYS.length-1].date)return "after";return "during";}
function todayKey(){const n=nowAms();const d=DAYS.find(d=>d.date===n.date);if(d)return d.key;return n.date<DAYS[0].date?DAYS[0].key:DAYS[DAYS.length-1].key;}

function fmtDur(m){m=Math.round(m);if(m<1)return "now";const h=Math.floor(m/60),r=m%60;return h?`${h}h ${r}m`:`${r} min`;}
function dayIndex(k){return DAYS.findIndex(d=>d.key===k);}

/* =========================================================
   GEO
   ========================================================= */
function km(a,b){const R=6371,r=Math.PI/180;const dl=(b.lat-a.lat)*r,dn=(b.lng-a.lng)*r;const x=Math.sin(dl/2)**2+Math.cos(a.lat*r)*Math.cos(b.lat*r)*Math.sin(dn/2)**2;return 2*R*Math.asin(Math.sqrt(x));}

function travelMin(p,anc){if(!hasLL(p))return 999;const d=km(anc,p);return d<2.2?Math.max(1,Math.round(d*13.5)):Math.round(10+d*3.5);}
function travel(p,anc){if(!hasLL(p))return "check Maps";const d=km(anc,p);const w=Math.round(d*13.5);if(d<2.2)return `${Math.max(1,w)} min walk`;return `~${Math.round(10+d*3.5)} min tram/Uber`;}
function maps(p){return hasLL(p)?`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(p.n+" Amsterdam")}`:`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(p.n+" Amsterdam")}`;}
let anchorMode="auto";
function whereAmI(){
  // Order: GPS (if allowed) → manual pick → last completed stop → current plan stop → hotel
  const g=ls(LSG);if(anchorMode==="auto"&&g&&Date.now()-g.t<30*60000)return {lat:g.lat,lng:g.lng,n:"your GPS position",basis:"GPS location",src:"gps"};
  if(anchorMode==="hotel")return Object.assign({basis:"you picked: hotel",src:"pick"},HOTEL);
  if(anchorMode&&ANCH[anchorMode])return Object.assign({basis:"you picked: "+ANCH[anchorMode].n,src:"pick"},ANCH[anchorMode]);
  const k=todayKey(),n=nowAms();
  if(tripPhase()==="during"){
    const L=itemsFor(k);
    const sm=L.find(i=>(i.p==="summit1"||i.p==="summit2"));
    if(sm&&n.min>=480&&n.min<1020&&istat(sm)!=="skip"&&!istat(L.find(i=>i.s==="RETURN")||{}))return Object.assign({basis:"current plan — World Summit AI",src:"plan"},TAETS);
    // last completed stop today: plan ticks (scheduled time) and card ticks (real time), latest wins
    const today0=Date.parse(n.date+"T00:00:00+02:00");
    const cands=[];
    L.filter(i=>istat(i)==="done"&&((i.p&&hasLL(PM[i.p]))||i.loc)).forEach(i=>{const t=tmin(i.t)+(i.s==="RETURN"?35:0);cands.push({t,pl:i.loc?ANCH[i.loc]:PM[i.p]});});
    Object.entries(S.when||{}).forEach(([id,ms])=>{if(ms>=today0&&PM[id]&&hasLL(PM[id])&&pstat(id)==="done"){const t=Math.round((ms-today0)/60000);cands.push({t,pl:PM[id]});}});
    cands.sort((a,b)=>b.t-a.t);

    if(cur&&n.min-tmin(cur.t)<150){const p=PM[cur.p];return {lat:p.lat,lng:p.lng,n:p.n,basis:"current plan stop — "+p.n,src:"plan"};}

}

/* =========================================================
   OPENING HOURS (saved with the app, not live)
   ========================================================= */
/* Verified hours for today, written by the Claude refresh into the feed (feed.hours[id]={date,open:"HH:MM",close:"HH:MM",closed,checked}) */
function liveHours(p){const H=FEED&&FEED.hours&&FEED.hours[p.id];if(!H||H.date!==nowAms().date)return null;return H;}
const hm2h=t=>{if(!t)return null;const [a,b]=t.split(":").map(Number);return a+b/60;};
function hours(p){const L=liveHours(p);if(L&&!L.closed&&L.open&&L.close){let o=hm2h(L.open),c=hm2h(L.close);if(c<=o)c+=24;return [o,c];}
if(p.oh)return p.oh;if(p.k==="sight"||p.k==="shop")return null;if(p.bf.includes("D")&&!p.bf.includes("L"))return [17,22];if(p.bf.includes("B"))return [8,17];if(p.k==="snack")return [10,18];return [12,22];}
function openAt(p,min,dow){const L=liveHours(p);if(L&&L.closed)return false;if(!L&&p.cl&&p.cl.includes(dow))return false;const h=hours(p);if(!h)return true;const t=min/60;return (t>=h[0]&&t<h[1])||(h[1]>24&&t+24<h[1]);}
function closesIn(p,min,dow){const h=hours(p);if(!h||!openAt(p,min,dow))return null;return Math.round(h[1]*60-min);}
function fmtH(x){const h=Math.floor(x)%24,m=Math.round((x%1)*60);return `${String(h).padStart(2,"0")}:${String(m).padStart(2,"0")}`;}
/* Hours are saved data, never live: label them honestly */
/* Google-style status: "Open · Closes 22:00", "Closes soon · 21:30", "Closed · Opens 17:00" / "Opens Thu 12:00" */
const DOW=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
function gStatus(p){
  const n=nowAms();const L=liveHours(p);const h=hours(p);
  if(!h&&!(L&&L.closed))return null;
  const open=openAt(p,n.min,n.dow);
  if(open){const left=h[1]*60-n.min-(h[1]>24&&n.min/60<h[0]?-1440:0);const closeT=fmtH(h[1]);
    return left<=60?{cls:"soon",txt:`Closes soon · ${closeT}`}:{cls:"open",txt:`Open · Closes ${closeT}`};}
  // closed: when does it open next?
  if(h&&!(L&&L.closed)&&n.min/60<h[0]&&!(p.cl&&p.cl.includes(n.dow)))return {cls:"closed",txt:`Closed · Opens ${fmtH(h[0])}`};
  const base=p.oh||h;if(!base)return {cls:"closed",txt:"Closed today"};
  for(let d=1;d<=7;d++){const dw=(n.dow+d)%7;if(p.cl&&p.cl.includes(dw))continue;return {cls:"closed",txt:`Closed · Opens ${d===1?"tomorrow":DOW[dw]} ${fmtH(base[0])}`};}
  return {cls:"closed",txt:"Closed"};
}
function hoursLabel(p,short){
  const st=gStatus(p);if(!st)return "";const L=liveHours(p);
  if(short)return L?`${st.cls==="open"?"🟢":st.cls==="soon"?"🟠":"🔴"} ${st.txt} ✓`:`${st.cls==="open"?"🟢":st.cls==="soon"?"🟠":"🔴"} ${st.txt}*`;
  if(L)return `${st.txt}${L.closed?"":` · today ${L.open}–${L.close}`} · hours checked ${fmtClock(Date.parse(L.checked))}${L.note?" · "+L.note:""}`;
  const h=hours(p);const cl=p.cl&&p.cl.length?` · closed ${p.cl.map(x=>DOW[x]).join("/")}`:"";
  return `${st.txt} · likely, based on saved hours ${fmtH(h[0])}–${fmtH(h[1])}${cl} · last checked 6 Oct`;
}

function pstat(id){return val(S.places,id);}
function itemsFor(key){
  const d=DM[key];let list=d.items.filter(it=>!S.moved[it.id]||S.moved[it.id]===key).map(it=>Object.assign({},it));
  DAYS.forEach(o=>{if(o.key!==key)o.items.forEach(it=>{if(S.moved[it.id]===key)list.push(Object.assign({},it,{from:o.title,t:S.moveT[it.id]||it.t}));});});
  Object.entries(S.extra||{}).forEach(([pid,k])=>{if(k===key&&PM[pid])list.push({id:"x-"+pid,t:S.moveT["x-"+pid]||"—",s:"ADDED",l:PM[pid].n,p:pid,added:true});});
  list=list.map(it=>{const r=S.repl[it.id];return r&&PM[r]?Object.assign({},it,{p:r,l:PM[r].n,d:"Your replacement"}):it;});
  list.sort((a,b)=>tmin(a.t)-tmin(b.t));

}
function istat(it){const s=val(S.items,it.id);if(s)return s;if(it.p&&pstat(it.p)==="done"&&it.added)return "done";return null;}

function isPast(key,it){const ph=tripPhase();const ti=dayIndex(todayKey()),di=dayIndex(key);if(ph==="after")return true;if(ph==="before")return false;if(di<ti)return true;if(di>ti)return false;return tmin(it.t)+30<nowAms().min;}

function xstat(id){const s=pstat(id);if(s)return s;return DAYS.some(d=>itemsFor(d.key).some(i=>i.p===id&&istat(i)!=="skip"))?"planned":null;}
const SL={null:"⬜ Not started",planned:"🟡 Planned",done:"✅ Done",skip:"❌ Skipped"};
const NEXTS={null:"planned",planned:"done",done:"skip",skip:null};

function findItem(iid){for(const d of DAYS){const it=d.items.find(i=>i.id===iid);if(it)return {it,d};}
  if(iid.startsWith("x-")){const pid=iid.slice(2);return {it:{id:iid,l:PM[pid].n,p:pid,s:"ADDED",added:true,t:"—"},d:DM[S.extra[pid]]||DAYS[0]};}return null;}

function nextUp(){
  const ph=tripPhase();const n=nowAms();
  let start=dayIndex(todayKey());
  for(let j=start;j<DAYS.length;j++){
    const key=DAYS[j].key;
    const L=itemsFor(key).filter(i=>!istat(i));
    const cand=(j===start&&ph==="during")?L.filter(i=>tmin(i.t)+20>=n.min):L;

/* =========================================================
   RECOMMENDER
   ========================================================= */
function mealNow(min){const h=(min??nowAms().min)/60;if(h<5)return "N";if(h<10.75)return "B";if(h<15)return "L";if(h<17)return "S";if(h<21.5)return "D";return "N";}
const MEALNAME={B:"Breakfast / brunch",L:"Lunch",S:"Afternoon bite",D:"Dinner",N:"Late-night"};
function trendInfo(id){
  const T=(FEED&&FEED.trends)||null;const map={hot:"hot",still:"worth",worth:"worth",hype:"hype",fresh:"fresh",local:"local"};
  const out=Object.assign({},TREND[id]||{});
  if(T){const gs=[];for(const g of Object.keys(map))if((T[g]||[]).some(x=>(x.id||x)===id))gs.push(map[g]);if(gs.length){out.g=gs;out.src=out.src||"Claude refresh";const x=Object.values(T).flat().find(x=>x&&x.id===id);if(x&&x.worth)out.worth=x.worth;}}
  return out.g?out:null;
}
function trendOf(p){const t=trendInfo(p.id);if(t){if(t.g.includes("hype"))return "hype";if(t.g.includes("hot"))return "hot";if(t.g.includes("fresh"))return "fresh";if(t.g.includes("worth"))return "still";if(t.g.includes("local"))return "local";}return p.tr||null;}
function score(p,anc,ctx){
  let s=(VR[p.v]||1)*10;
  const tm=travelMin(p,anc);s-=Math.min(tm,60)*0.6;
  if(S.rate[p.id]===1)s+=6;
  // de-prioritise cuisines similar to ones disliked
  const dis=P.filter(x=>S.rate[x.id]===-1).map(x=>x.cu);if(dis.includes(p.cu))s-=12;
  const tr=trendOf(p);if(tr==="hot"||tr==="fresh")s+=3;if(tr==="hype")s-=8;
  if(ctx&&ctx.openOnly&&!openAt(p,ctx.min,ctx.dow))s-=100;
  if(p.res==="r")s-=6;
  if(pstat(p.id)==="planned")s+=2;
  if(ctx&&ctx.planned&&ctx.planned.has(p.id))s+=9;
  return s;
}
/* What counts as food for this moment. Bakeries/desserts never lead at breakfast-lunch-dinner. */
function isMealFor(p,meal){
  if(meal==="B")return p.bf.includes("B")&&(p.k==="meal"||p.cat.includes("bakery"));
  if(meal==="L")return p.k==="meal"&&(p.bf.includes("L")||p.bf.includes("B"));
  if(meal==="D")return p.k==="meal"&&p.bf.includes("D");
  if(meal==="N")return p.bf.includes("N")||p.cat.includes("late");
  return p.bf.includes("S")||p.k==="snack";
}
function pool(meal,hunger){
  let L=P.filter(p=>isFood(p)&&avail(p)&&p.v!=="photo"&&hasLL(p));
  if(meal==="N"&&!hunger&&!ateDinnerToday()){const m=L.filter(p=>p.k==="meal"&&(p.bf.includes("N")||p.cat.includes("late")||p.bf.includes("D")));if(m.length>=3)return m.concat(L.filter(p=>p.k==="snack"&&(p.bf.includes("N")||p.cat.includes("late"))));}
  if(hunger==="Light")return L.filter(p=>(p.k==="snack"||p.pr==="€")&&(meal==="D"||meal==="N"?true:p.bf.some(b=>"BLS".includes(b))));
  if(hunger==="Hungry")return L.filter(p=>p.k==="meal"&&isMealFor(p,meal==="S"?"L":meal==="N"?"N":meal));
  return L.filter(p=>isMealFor(p,meal));
}
function recommend(opts){
  const n=nowAms(),anc=opts.anc||whereAmI(),meal=opts.meal||mealNow(),at=opts.at??n.min;
  const planned=new Set(tripPhase()==="during"?itemsFor(todayKey()).filter(i=>i.p&&!istat(i)).map(i=>i.p):[]);
  const ctx={openOnly:true,min:at,dow:n.dow,planned};
  let L=pool(meal,opts.hunger);
  const open=L.filter(p=>openAt(p,at,n.dow)&&(closesIn(p,at,n.dow)??999)>=40);if(open.length>=3)L=open;
  L.forEach(p=>p._s=score(p,anc,ctx));
  const sorted=L.slice().sort((a,b)=>b._s-a._s);
  const used=new Set();const pick=(arr,cond)=>{const x=arr.find(p=>!used.has(p.id)&&(!cond||cond(p)));if(x)used.add(x.id);return x;};
  const proper=p=>p.k==="meal"&&(meal==="B"?true:PRN[p.pr]>=2||p.cat.includes("indonesian")||p.cat.includes("surinamese"));
  const hungryLate=meal==="N"&&!ateDinnerToday();
  const best=pick(sorted,p=>meal==="S"?true:meal==="N"?(hungryLate?p.k==="meal":true):proper(p));
  const prop=pick(sorted,proper);
  const viral=pick(sorted,p=>["hot","still","fresh"].includes(trendOf(p))||p.v==="must");
  const cheap=pick(sorted,p=>p.pr==="€");
  const tried=new Set(P.filter(p=>pstat(p.id)==="done").map(p=>p.cu));
  const diff=pick(sorted,p=>!tried.has(p.cu)&&p.cu!==(best&&best.cu));
  const lateL=P.filter(p=>avail(p)&&hasLL(p)&&p.v!=="photo"&&(p.cat.includes("late")||p.cat.includes("fries")||p.k==="snack")&&openAt(p,at,n.dow)).sort((a,b)=>travelMin(a,anc)-travelMin(b,anc));
  const late=pick(lateL);
  const rows=[["BEST OVERALL",best],["PROPER MEAL",prop],["VIRAL NEARBY",viral],["CHEAP",cheap],["SOMETHING DIFFERENT",diff],[meal==="N"?"LATE / QUICK":"QUICK BITE",late]].filter(r=>r[1]);
  return {rows,anc,meal};
}
/* =========================================================
   UI BITS
   ========================================================= */
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
function toast(t){const el=document.getElementById("toast");el.textContent=t;el.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>el.hidden=true,1800);}
function altFor(p,anc){
  const n=nowAms();
  if(ALT[p.id]){const a=ALT[p.id].map(id=>PM[id]).filter(x=>x&&avail(x)).slice(0,2);if(a.length)return {why:ALTWHY[p.id]||"Better pick",list:a};}

function renderTonight(anc){
  const n=nowAms();const k=todayKey();const idx=dayIndex(k);const tomorrow=DAYS[idx+1];
  const curfew=tomorrow&&(tomorrow.summit||tomorrow.depart)?22.5*60:23.75*60;
  const start=Math.max(n.min,17*60);
  if(DM[k].depart&&tripPhase()==="during")return `<div class="card sm">Departure day: no evening plan. Safe flight on EK148.</div>`;
  const wet=rainSoon()!==null||/storm|rain 8|80%/i.test(dayWx(k).txt);
  const steps=[];let t=start;let here=anc;
  const add=(time,label,p,extra)=>steps.push({time,label,p,extra});
  if(!ateDinnerToday()){
    let dinner=null;const planned=itemsFor(k).find(i=>/DINNER/.test(i.s)&&!istat(i)&&i.p);
    if(planned){const p=PM[planned.p];if(openAt(p,t,n.dow)&&(closesIn(p,t,n.dow)??999)>=75)dinner=p;}
    const meal=t>=21.5*60?"N":"D";
    if(!dinner){const R=recommend({meal,at:t,anc:here});dinner=(R.rows.find(r=>r[0]==="BEST OVERALL")||R.rows[0]||[])[1];}
    if(dinner){t+=travelMin(dinner,here);add(t,meal==="N"?"Late food":"Dinner",dinner,planned&&planned.p===dinner.id?"from your plan":"");here=dinner;t+=meal==="N"?35:80;}
  }
  const ate=ateDinnerToday()||steps.length>0;
  const evening=itemsFor(k).filter(i=>/EVENING|NIGHT|SUNSET|WALK/.test(i.s)&&!istat(i)&&i.p&&hasLL(PM[i.p])&&tmin(i.t)+30>=t);
  if(evening.length&&t<curfew-40){for(const it of evening.slice(0,2)){if(t>=curfew-40)break;const p=PM[it.p];t=Math.max(t+travelMin(p,here),tmin(it.t));add(t,it.s==="NIGHT"?"Night":"Evening",p,wet?"from your plan · skip if it’s pouring":"from your plan");here=p;t+=it.s==="NIGHT"?75:30;}}
  else if(!wet&&t<curfew-50){
    const sights=["torensluis","waag","sevenbridges","magere","brouwersgracht","jordaan","goldenbend","dam"].map(id=>PM[id]).filter(p=>p&&hasLL(p)).sort((a,b)=>(pstat(a.id)==="done")-(pstat(b.id)==="done")||km(here,a)-km(here,b));
    const w=sights[0];if(w&&travelMin(w,here)<=15){t+=travelMin(w,here);add(t,"Short canal walk",w,"20 min");here=w;t+=20;}
  }
  if(t<curfew-35){
    const late=P.filter(p=>avail(p)&&hasLL(p)&&p.v!=="photo"&&(ate?p.k==="snack":true)&&(p.cat.includes("dessert")||p.cat.includes("late")||p.cat.includes("fries"))&&openAt(p,t+10,n.dow)&&(closesIn(p,t+10,n.dow)??999)>=20).sort((a,b)=>km(here,a)-km(here,b))[0];
    if(late&&travelMin(late,here)<=12){t+=travelMin(late,here);add(t,"Optional late bite",late,"");here=late;t+=20;}
  }
  const back=travelMin(HOTEL,here);t+=back;
  const hhmm=m=>`${String(Math.floor(m/60)%24).padStart(2,"0")}:${String(Math.round(m%60)).padStart(2,"0")}`;
  return `<div class="card"><div class="lab" style="margin-top:0">TONIGHT ${start>n.min?"(FROM 17:00)":"FROM NOW"}${wet?" · RAIN-AWARE":""}</div>
  ${ateDinnerToday()?`<div class="sm muted">You’ve had dinner, so this skips straight to the evening.</div>`:""}
  <ol class="sm" style="margin:6px 0 0;padding-left:18px">${steps.map(s=>`<li style="margin:6px 0"><b>${hhmm(s.time)} · ${esc(s.label)}:</b> <button class="btn" style="padding:2px 8px;font-size:13px" data-open="${s.p.id}">${esc(s.p.n)}</button>${s.p.o&&s.p.k!=="sight"?`<div class="muted">Order: ${esc(s.p.o)}</div>`:""}${s.extra?` <span class="muted">${esc(s.extra)}</span>`:""}</li>`).join("")}
  <li style="margin:6px 0"><b>${hhmm(t)} · Hotel</b> <span class="muted">(${back} min)</span>${tomorrow&&tomorrow.summit?` · summit tomorrow, leave 07:35`:tomorrow&&tomorrow.depart?" · driver 11:25 tomorrow":""}</li></ol>
  <div class="src">Hours are saved data (checked 6 Oct).</div></div>`;
}

  const gone=(x)=>{const p=PM[x.p];if(!p)return true;if(x.why.startsWith("Needs")){const b=BOOK.find(b=>b.p===x.p);return b&&b.day===k&&n.min>tmin((b.when.match(/\d\d:\d\d/)||["23:59"])[0]);}const h=hours(p);
    // on Friday (last full day) a place that has closed for the day is no longer possible
    if(k==="fri"&&h&&n.min>=h[1]*60)return true;

function bestSlot(key,p){
  const L=itemsFor(key).filter(i=>i.p&&hasLL(PM[i.p])&&i.t!=="—");if(!L.length||!hasLL(p))return "—";
  let best=L[0],bd=1e9;L.forEach(i=>{const d=km(PM[i.p],p);if(d<bd){bd=d;best=i;}});
  const m=tmin(best.t)+(PM[best.p].k==="meal"?75:45);const h=Math.min(23,Math.floor(m/60)),mm=m%60<30?"00":"30";return `${String(h).padStart(2,"0")}:${mm}`;
}

}

  if(d.rate){const [id,v]=d.rate.split(":");persist({rate:{[id]:+v}});toast(+v>0?"Liked":"Disliked — fewer like this");placeSheet(id);return;}

(async()=>{
  try{
    if(!window.claude||!window.claude.use)return;
    db=await window.claude.use("db");if(!db)return;cloud=true;
    docRef=db.doc("trip/state");feedRef=db.doc("live/feed");

      if(snap.exists){docExists=true;const data=snap.data()||{};

          const merged={};KEYS.forEach(k=>{merged[k]=Object.assign({},data[k]||{},S[k]||{});});
          const missing={};KEYS.forEach(k=>{Object.entries(S[k]||{}).forEach(([a,b])=>{if(b&&!(data[k]||{})[a]){(missing[k]=missing[k]||{})[a]=b;}});});
          S=merged;ls(LS,S);if(Object.keys(missing).length)docRef.update(missing).catch(()=>{});first=false;}
        else{KEYS.forEach(k=>S[k]=Object.assign({},data[k]||{}));ls(LS,S);}
        renderAll();}
    },()=>{});
    feedRef.onSnapshot(snap=>{if(snap.exists){FEED=snap.data();if(!snap.metadata||!snap.metadata.fromCache)feedLiveAt=Date.now();ls(LSF,FEED);renderAll();}},()=>{});
  }catch(_){}
})();
